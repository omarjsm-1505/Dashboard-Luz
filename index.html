<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Árbol Ultra Compacto - Editor Integrado</title>
<style>
  :root {
    --bg: #070b12;
    --bar: #111827;
    --bar-hover: #1e293b;
    --border: #283548;
    --text: #f8fafc;
    --muted: #94a3b8;
    --gen1: #f59e0b; /* Abuelos */
    --gen2: #38bdf8; /* Padres / Tíos */
    --gen3: #10b981; /* Hermanos */
    --yo: #a855f7;   /* Lester / Piglet */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

  body {
    background: var(--bg);
    color: var(--text);
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.25;
  }

  .app { max-width: 950px; margin: 0 auto; }

  /* Barra Superior */
  .hud {
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    margin-bottom: 8px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .hud-izq { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .titulo { font-weight: 800; color: #fbbf24; font-size: 12px; text-transform: uppercase; }

  .buscador {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 3px 8px;
    border-radius: 5px;
    font-size: 11.5px;
    width: 140px;
    outline: none;
  }
  .buscador:focus { border-color: var(--gen2); }

  .filtros { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }

  .btn {
    background: var(--bar-hover);
    border: 1px solid var(--border);
    color: #cbd5e1;
    padding: 3px 7px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.12s;
  }
  .btn:hover, .btn.activo-filtro {
    border-color: #fbbf24;
    color: #fbbf24;
    background: rgba(251, 191, 36, 0.12);
  }
  .btn-primary { background: rgba(56,189,248,0.15); border-color: #38bdf8; color: #38bdf8; }
  .btn-primary:hover { background: rgba(56,189,248,0.25); color: #fff; }

  .contador {
    font-size: 10.5px;
    color: #38bdf8;
    background: rgba(56,189,248,0.1);
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 700;
  }

  /* Estructura del Árbol */
  .seccion {
    border: 1px solid #1e293b;
    background: rgba(15, 23, 42, 0.4);
    border-radius: 7px;
    padding: 6px 8px;
    margin-bottom: 6px;
  }

  .sec-titulo {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 4px;
    font-weight: 700;
  }

  .rama {
    margin-left: 12px;
    padding-left: 9px;
    border-left: 1px solid #334155;
  }

  .nodo { position: relative; margin: 2px 0; }
  .rama > .nodo::before {
    content: "";
    position: absolute;
    top: 11px; left: -9px;
    width: 9px; height: 1px;
    background: #334155;
  }

  .linea-persona {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
  }

  .barra {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--bar);
    border: 1px solid var(--border);
    border-left: 3px solid var(--c, var(--gen1));
    padding: 2px 8px 2px 5px;
    border-radius: 5px;
    cursor: pointer;
    user-select: none;
    transition: 0.12s;
    height: 22px;
  }

  .barra:hover { background: var(--bar-hover); border-color: var(--c); }
  .barra.activo { background: #1e293b; border-color: var(--c); }
  .barra.protagonista { background: rgba(168,85,247,0.18); border-color: var(--yo); }

  .ico { font-size: 12px; }
  .nom { font-weight: 700; font-size: 12px; color: #fff; white-space: nowrap; }
  .rol {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase;
    color: var(--c); background: rgba(255,255,255,0.05);
    padding: 0 5px; border-radius: 3px; white-space: nowrap;
  }
  .edad-mini { font-size: 10.5px; color: #cbd5e1; white-space: nowrap; }

  .eq-tag { font-size: 9.5px; font-weight: 700; padding: 0 4px; border-radius: 3px; white-space: nowrap; }
  .eq-Leones { color: #fde047; background: rgba(234,179,8,0.15); }
  .eq-Magallanes { color: #93c5fd; background: rgba(59,130,246,0.15); }
  .eq-Cardenales { color: #fca5a5; background: rgba(239,68,68,0.15); }

  .flecha { font-size: 8px; color: var(--muted); }
  .barra.activo .flecha { transform: rotate(90deg); color: var(--c); }

  .ficha-inline {
    display: none;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    background: #0b1120;
    border: 1px solid var(--c);
    border-radius: 5px;
    padding: 1px 6px;
    min-height: 22px;
  }
  .ficha-inline.abierto { display: inline-flex; }

  .chip-dato {
    font-size: 11px; color: #e2e8f0;
    background: rgba(255,255,255,0.04);
    padding: 0 5px; border-radius: 3px; white-space: nowrap;
  }
  .chip-dato b { color: var(--muted); font-weight: 600; font-size: 10px; }

  .btn-editar {
    background: rgba(255,255,255,0.06);
    border: none; color: #94a3b8;
    padding: 0 5px; border-radius: 3px; cursor: pointer; font-size: 10px; height: 18px;
  }
  .btn-editar:hover { background: #38bdf8; color: #000; }

  /* Modal de Edición / Creación */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: none; align-items: center; justify-content: center; z-index: 1000;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.activo { display: flex; }
  .modal {
    background: #0f172a; border: 1px solid #38bdf8; border-radius: 10px;
    padding: 16px; width: 340px; max-width: 90vw; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  }
  .modal h3 { color: #fbbf24; font-size: 13px; text-transform: uppercase; margin-bottom: 10px; }
  .form-group { margin-bottom: 8px; }
  .form-group label { display: block; font-size: 10.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; }
  .form-control {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: #fff;
    padding: 5px 8px; border-radius: 5px; font-size: 11.5px; outline: none;
  }
  .form-control:focus { border-color: #38bdf8; }
  .modal-botones { display: flex; justify-content: flex-end; gap: 6px; margin-top: 12px; }

  .oculto-total { display: none !important; }
  .nodo.ocultar-propio > .linea-persona { display: none !important; }
  .nodo.ocultar-propio::before { display: none !important; }
  .nodo.ocultar-propio > .rama { margin-left: 0; padding-left: 0; border-left: none; }

  .vacio { display: none; text-align: center; padding: 14px; border: 1px dashed var(--border); border-radius: 8px; color: var(--muted); }
  .vacio.visible { display: block; }
</style>
</head>
<body>

<div class="app">
  <div class="hud">
    <div class="hud-izq">
      <span class="titulo">🎮 Linaje • Lester</span>
      <input type="text" id="buscador" class="buscador" placeholder="🔍 Buscar..." oninput="filtrar(this.value)">
      <button class="btn btn-primary" onclick="abrirModalNuevo()">➕ Agregar</button>
      <button class="btn" onclick="alternarTodo(true)">➕ Todo</button>
      <button class="btn" onclick="alternarTodo(false)">➖ Nada</button>
    </div>
    <div class="filtros" id="botones-eq">
      <button class="btn activo-filtro" data-eq="todos" onclick="cambiarEq('todos', this)">Todos</button>
      <button class="btn" data-eq="Leones" onclick="cambiarEq('Leones', this)">🦁 Leones</button>
      <button class="btn" data-eq="Magallanes" onclick="cambiarEq('Magallanes', this)">⚓ Magallanes</button>
      <button class="btn" data-eq="Cardenales" onclick="cambiarEq('Cardenales', this)">🐦 Cardenales</button>
      <button class="btn" onclick="resetearDatos()" title="Volver al árbol inicial" style="color:#fca5a5;">🔄 Reset</button>
      <span class="contador" id="contador">17 / 17</span>
    </div>
  </div>

  <div id="arbol"></div>
  <div id="vacio" class="vacio">Sin resultados.</div>
</div>

<!-- Modal de Edición -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modal-titulo">Editar Familiar</h3>
    <input type="hidden" id="edit-id">
    <div class="form-group"><label>Nombre</label><input type="text" id="edit-n" class="form-control"></div>
    <div class="form-group"><label>Rol / Parentesco</label><input type="text" id="edit-r" class="form-control"></div>
    <div class="form-group"><label>Edad / Estado</label><input type="text" id="edit-e" class="form-control"></div>
    <div class="form-group">
      <label>Equipo LVBP</label>
      <select id="edit-eq" class="form-control">
        <option value="Leones">Leones del Caracas</option>
        <option value="Magallanes">Navegantes del Magallanes</option>
        <option value="Cardenales">Cardenales de Lara</option>
        <option value="Sin definir">Sin definir / Otro</option>
      </select>
    </div>
    <div class="form-group"><label>Hobbies / Datos (Ej: Signo: Libra, Hobbies: Leer)</label><input type="text" id="edit-detalles" class="form-control"></div>
    <div class="modal-botones">
      <button class="btn" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarCambios()">Guardar</button>
    </div>
  </div>
</div>

<script>
// Base de datos inicial con ID único para cada integrante
const datosIniciales = [
  {
    sec: "🌸 Rama Materna",
    nodos: [
      { id: "m1", n: "Haidee Moreno", r: "Abuela Materna", i: "👵", c: "var(--gen1)", e: "70a", eq: "Leones", d: { Edad: "70 años", Signo: "♏ Escorpio", Hobbies: "Ver Novelas", Equipo: "Leones" }, h: [] },
      { id: "m2", n: "José Gómez", r: "Abuelo Materno", i: "🕊️", c: "var(--gen1)", e: "† 34a", eq: "Leones", d: { Estado: "Murió a los 34 años", Signo: "♎ Libra", Hobbies: "Mecánica", Equipo: "Leones" }, h: [
        { id: "m3", n: "Yesenia Gómez", r: "Madre", i: "👩", c: "var(--gen2)", e: "48a", eq: "Cardenales", d: { Edad: "48 años", Signo: "♎ Libra", Hobbies: "Leer", Equipo: "Cardenales" }, h: [
          { id: "m4", n: "José Mariño", r: "Hermano Mat.", i: "👦", c: "var(--gen3)", e: "22a", eq: "Magallanes", d: { Edad: "22 años", Signo: "♓ Piscis", Hobbies: "Dormir", Equipo: "Magallanes" }, h: [] },
          { id: "m5", n: "Shannen Mariño", r: "Hermana Mat.", i: "👧", c: "var(--gen3)", e: "20a", eq: "Magallanes", d: { Edad: "20 años", Signo: "♏ Escorpio", Hobbies: "Leer", Equipo: "Magallanes" }, h: [] }
        ]},
        { id: "m6", n: "José Gómez", r: "Tío Materno", i: "👨", c: "var(--gen2)", e: "Tío", eq: "Sin definir", d: { Parentesco: "Tío Materno", Rama: "Gómez Moreno" }, h: [] },
        { id: "m7", n: "Marcos Hernández", r: "Tío Materno", i: "👨", c: "var(--gen2)", e: "Tío", eq: "Sin definir", d: { Parentesco: "Tío Materno", Rama: "Materna" }, h: [] },
        { id: "m8", n: "Diego Hernández", r: "Tío Materno", i: "👨", c: "var(--gen2)", e: "Tío", eq: "Sin definir", d: { Parentesco: "Tío Materno", Rama: "Materna" }, h: [] }
      ]}
    ]
  },
  {
    sec: "🛡️ Rama Paterna",
    nodos: [
      { id: "p1", n: "Marlene Marrero", r: "Abuela Paterna", i: "👵", c: "var(--gen1)", e: "67a", eq: "Magallanes", d: { Edad: "67 años", Signo: "♐ Sagitario", Hobbies: "Apuestas Royal", Equipo: "Magallanes" }, h: [] },
      { id: "p2", n: "Omar Sánchez", r: "Abuelo Paterno", i: "🕊️", c: "var(--gen1)", e: "† 1983", eq: "Sin definir", d: { Estado: "Murió en 1983", Rol: "Patriarca" }, h: [
        { id: "p3", n: "Omar Sánchez", r: "Padre", i: "👨", c: "var(--gen2)", e: "43a", eq: "Leones", d: { Edad: "43 años", Signo: "♑ Capricornio", Hobbies: "Hablar con Géminis", Equipo: "Leones" }, h: [
          { id: "p4", n: "Kamila Sánchez", r: "Hermana Pat.", i: "👧", c: "var(--gen3)", e: "20a", eq: "Leones", d: { Edad: "20 años", Signo: "♒ Acuario", Hobbies: "Idiomas", Equipo: "Leones" }, h: [] }
        ]},
        { id: "p5", n: "Omaira Sánchez", r: "Tía Paterna", i: "👩", c: "var(--gen2)", e: "Tía", eq: "Sin definir", d: { Parentesco: "Tía Paterna", Rama: "Sánchez Marrero" }, h: [] },
        { id: "p6", n: "Robert Marrero", r: "Tío Paterno", i: "👨", c: "var(--gen2)", e: "Tío", eq: "Sin definir", d: { Parentesco: "Tío Paterno", Rama: "Paterna" }, h: [] },
        { id: "p7", n: "Jesmar Marrero", r: "Tío Paterno", i: "👨", c: "var(--gen2)", e: "Tío", eq: "Sin definir", d: { Parentesco: "Tío Paterno", Rama: "Paterna" }, h: [] }
      ]}
    ]
  },
  {
    sec: "⭐ Protagonista",
    nodos: [
      { id: "y1", n: "Lester Sánchez (Yo)", r: "Protagonista", i: "🎮", c: "var(--yo)", e: "15a", eq: "Cardenales", yo: 1, d: { Edad: "15 años", Signo: "♍ Virgo", Hobbies: "TikTok y Volleyball", Equipo: "Cardenales", Mascota: "Piglet (Conejo)" }, h: [
        { id: "y2", n: "Piglet", r: "Mascota", i: "🐰", c: "var(--yo)", e: "Conejo", eq: "Sin definir", d: { Especie: "Conejo", Dueño: "Lester Sánchez" }, h: [] }
      ]}
    ]
  }
];

// Cargar desde localStorage o usar iniciales
let arbolData = JSON.parse(localStorage.getItem("arbol_lester_v2")) || datosIniciales;
let eqActual = "todos", txtActual = "";

function guardarStorage() {
  localStorage.setItem("arbol_lester_v2", JSON.stringify(arbolData));
}

const norm = (s) => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

const badgeEq = (eq) => eq === "Leones" ? `<span class="eq-tag eq-Leones">🦁</span>` :
                        eq === "Magallanes" ? `<span class="eq-tag eq-Magallanes">⚓</span>` :
                        eq === "Cardenales" ? `<span class="eq-tag eq-Cardenales">🐦</span>` : "";

function renderNodo(p) {
  const busq = norm(`${p.n} ${p.r} ${p.e} ${p.eq} ${Object.values(p.d).join(' ')}`);
  return `
    <div class="nodo" data-id="${p.id}" data-search="${busq}" data-eq="${p.eq}" data-yo="${p.yo ? '1' : '0'}" style="--c:${p.c}">
      <div class="linea-persona">
        <div class="barra ${p.yo ? 'protagonista activo' : ''}" onclick="toggle(this)">
          <span class="ico">${p.i}</span>
          <span class="nom">${p.n}</span>
          <span class="rol">${p.r}</span>
          <span class="edad-mini">${p.e}</span>
          ${badgeEq(p.eq)}
          <span class="flecha">▶</span>
        </div>
        <div class="ficha-inline ${p.yo ? 'abierto' : ''}">
          ${Object.entries(p.d).map(([k,v]) => `<span class="chip-dato"><b>${k}:</b>${v}</span>`).join('')}
          <button class="btn-editar" onclick="abrirModalEditar('${p.id}')" title="Editar">✏️</button>
        </div>
      </div>
      ${p.h && p.h.length ? `<div class="rama">${p.h.map(renderNodo).join('')}</div>` : ''}
    </div>`;
}

function renderizar() {
  document.getElementById("arbol").innerHTML = arbolData.map(s => `
    <div class="seccion">
      <div class="sec-titulo">${s.sec}</div>
      ${s.nodos.map(renderNodo).join('')}
    </div>`).join('');
  aplicarFiltros();
}

function toggle(b) {
  b.classList.toggle("activo");
  b.nextElementSibling.classList.toggle("abierto");
}

function alternarTodo(abrir) {
  document.querySelectorAll(".nodo:not(.oculto-total):not(.ocultar-propio)").forEach(n => {
    n.querySelector(":scope > .linea-persona > .barra").classList.toggle("activo", abrir);
    n.querySelector(":scope > .linea-persona > .ficha-inline").classList.toggle("abierto", abrir);
  });
}

function aplicarFiltros() {
  const nodos = Array.from(document.querySelectorAll(".nodo"));
  let cont = 0;

  nodos.forEach(n => {
    const okEq = (eqActual === "todos") || (n.dataset.eq === eqActual);
    const okTxt = (!txtActual) || n.dataset.search.includes(txtActual);
    n.dataset.ok = (okEq && okTxt) ? "1" : "0";
    if (okEq && okTxt) cont++;
  });

  nodos.forEach(n => {
    const propio = n.dataset.ok === "1";
    const hijoOk = Array.from(n.querySelectorAll(".nodo")).some(h => h.dataset.ok === "1");
    n.classList.remove("oculto-total", "ocultar-propio");

    if (propio) {
      const abrir = (eqActual !== "todos" || txtActual !== "") ? true : (n.dataset.yo === "1");
      n.querySelector(":scope > .linea-persona > .barra").classList.toggle("activo", abrir);
      n.querySelector(":scope > .linea-persona > .ficha-inline").classList.toggle("abierto", abrir);
    } else if (hijoOk) {
      n.classList.add("ocultar-propio");
    } else {
      n.classList.add("oculto-total");
    }
  });

  document.querySelectorAll(".seccion").forEach(sec => {
    const visible = Array.from(sec.querySelectorAll(".nodo")).some(n => n.dataset.ok === "1");
    sec.classList.toggle("oculto-total", !visible);
  });

  document.getElementById("contador").textContent = `${cont} / ${nodos.length}`;
  document.getElementById("vacio").classList.toggle("visible", cont === 0);
}

function cambiarEq(eq, btn) {
  eqActual = eq;
  document.querySelectorAll("#botones-eq .btn[data-eq]").forEach(b => b.classList.remove("activo-filtro"));
  if (btn) btn.classList.add("activo-filtro");
  aplicarFiltros();
}

function filtrar(val) {
  txtActual = norm(val.trim());
  aplicarFiltros();
}

function resetearDatos() {
  if (confirm("¿Deseas restaurar el árbol a su estado original?")) {
    localStorage.removeItem("arbol_lester_v2");
    arbolData = JSON.parse(JSON.stringify(datosIniciales));
    renderizar();
  }
}

// Funciones del Modal de Edición
let nodoEnEdicion = null;

function buscarNodoRecursivo(lista, id) {
  for (let item of lista) {
    if (item.id === id) return item;
    if (item.h && item.h.length > 0) {
      let res = buscarNodoRecursivo(item.h, id);
      if (res) return res;
    }
  }
  return null;
}

function abrirModalEditar(id) {
  let nodo = null;
  for (let sec of arbolData) {
    nodo = buscarNodoRecursivo(sec.nodos, id);
    if (nodo) break;
  }
  if (!nodo) return;

  nodoEnEdicion = nodo;
  document.getElementById("modal-titulo").textContent = `Editar a ${nodo.n}`;
  document.getElementById("edit-n").value = nodo.n;
  document.getElementById("edit-r").value = nodo.r;
  document.getElementById("edit-e").value = nodo.e;
  document.getElementById("edit-eq").value = nodo.eq;
  
  // Convertir objeto d a formato texto clave: valor
  let detStr = Object.entries(nodo.d).map(([k,v]) => `${k}: ${v}`).join(", ");
  document.getElementById("edit-detalles").value = detStr;

  document.getElementById("modal").classList.add("activo");
}

function abrirModalNuevo() {
  nodoEnEdicion = null;
  document.getElementById("modal-titulo").textContent = "Agregar Nuevo Familiar";
  document.getElementById("edit-n").value = "";
  document.getElementById("edit-r").value = "Familiar";
  document.getElementById("edit-e").value = "Edad";
  document.getElementById("edit-eq").value = "Sin definir";
  document.getElementById("edit-detalles").value = "Edad: --, Signo: --, Hobbies: --";
  document.getElementById("modal").classList.add("activo");
}

function cerrarModal() {
  document.getElementById("modal").classList.remove("activo");
}

function guardarCambios() {
  const n = document.getElementById("edit-n").value.trim();
  const r = document.getElementById("edit-r").value.trim();
  const e = document.getElementById("edit-e").value.trim();
  const eq = document.getElementById("edit-eq").value;
  const detRaw = document.getElementById("edit-detalles").value;

  if (!n) { alert("El nombre es obligatorio"); return; }

  // Reconstruir objeto d
  let dObj = {};
  detRaw.split(",").forEach(par => {
    let partes = par.split(":");
    if (partes.length >= 2) {
      dObj[partes[0].trim()] = partes.slice(1).join(":").trim();
    }
  });

  if (nodoEnEdicion) {
    nodoEnEdicion.n = n;
    nodoEnEdicion.r = r;
    nodoEnEdicion.e = e;
    nodoEnEdicion.eq = eq;
    nodoEnEdicion.d = dObj;
  } else {
    // Crear nuevo nodo básico en la primera rama por defecto
    let nuevoNodo = {
      id: "gen_" + Date.now(),
