<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Árbol Genealógico Interactivo</title>
<style>
  :root {
    --bg: #0b0f19;
    --panel: #151c2c;
    --panel-hover: #1e293b;
    --border: #2a364f;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --gen1: #f59e0b; /* Dorado */
    --gen2: #38bdf8; /* Azul */
    --gen3: #10b981; /* Esmeralda */
    --gen4: #a855f7; /* Violeta */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
  
  body {
    background: radial-gradient(circle at 50% 0%, #1e293b 0%, var(--bg) 75%);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
    font-size: 13.5px;
  }

  .contenedor { max-width: 780px; margin: 0 auto; }

  /* Cabecera y Controles Intuitivos */
  .cabecera {
    background: rgba(21, 28, 44, 0.85);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .titulo-box h1 {
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gen1);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .titulo-box p { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .controles { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .buscador {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    outline: none;
    width: 190px;
    transition: 0.2s;
  }
  .buscador:focus { border-color: var(--gen2); box-shadow: 0 0 8px rgba(56,189,248,0.25); }

  .btn {
    background: var(--panel-hover);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    transition: 0.2s;
    font-weight: 600;
  }
  .btn:hover { border-color: var(--gen1); color: var(--gen1); }

  /* Líneas conectoras del árbol */
  .rama {
    margin-left: 20px;
    padding-left: 14px;
    border-left: 2px solid #26334d;
    position: relative;
  }

  .nodo { position: relative; margin: 6px 0; }
  
  /* Conector horizontal tipo codo */
  .rama > .nodo::before {
    content: "";
    position: absolute;
    top: 18px;
    left: -14px;
    width: 14px;
    height: 2px;
    background: #26334d;
  }

  /* Barra compacta de cada persona */
  .barra {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--color-gen, var(--gen1));
    padding: 6px 12px 6px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }

  .barra:hover {
    background: var(--panel-hover);
    transform: translateX(3px);
    border-color: var(--color-gen);
  }

  .barra.activo {
    background: #1a2438;
    border-color: var(--color-gen);
    box-shadow: 0 0 14px rgba(0,0,0,0.4), inset 0 0 8px rgba(255,255,255,0.03);
  }

  .avatar {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  .nom { font-weight: 700; color: var(--text); font-size: 13.5px; }

  .badge-rol {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 99px;
    background: rgba(255,255,255,0.06);
    color: var(--color-gen);
    letter-spacing: 0.4px;
  }

  .badge-hijos {
    font-size: 11px;
    color: var(--muted);
    background: var(--bg);
    padding: 1px 6px;
    border-radius: 6px;
  }

  .flecha {
    font-size: 10px;
    color: var(--muted);
    margin-left: 4px;
    transition: transform 0.25s ease;
  }
  .barra.activo .flecha { transform: rotate(180deg); color: var(--color-gen); }

  /* Ficha desplegable en línea (Estilo RPG) */
  .ficha {
    display: none;
    background: linear-gradient(145deg, #111726, #0d1320);
    border: 1px solid var(--border);
    border-left: 3px solid var(--color-gen);
    border-radius: 0 10px 10px 10px;
    margin: 5px 0 10px 12px;
    padding: 10px 12px;
    max-width: 560px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.45);
    animation: desplegar 0.2s ease-out;
  }

  .ficha.abierto { display: block; }

  .grid-datos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 6px;
    margin-bottom: 8px;
  }

  .dato-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    padding: 4px 8px;
    border-radius: 6px;
  }

  .dato-label { font-size: 10px; color: var(--muted); text-transform: uppercase; display: block; }
  .dato-valor { font-size: 12px; font-weight: 600; color: #e2e8f0; }

  .historia {
    font-size: 12.5px;
    line-height: 1.45;
    color: #cbd5e1;
    background: rgba(0,0,0,0.25);
    padding: 8px 10px;
    border-radius: 6px;
  }

  .oculto-filtro { display: none !important; }

  @keyframes desplegar {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="contenedor">
  <div class="cabecera">
    <div class="titulo-box">
      <h1>🛡️ Árbol de Linaje</h1>
      <p>Toca cualquier integrante para desplegar su ficha completa</p>
    </div>
    <div class="controles">
      <input type="text" id="buscador" class="buscador" placeholder="🔍 Buscar nombre o dato..." oninput="filtrarArbol(this.value)">
      <button class="btn" onclick="alternarTodos(true)">➕ Abrir todo</button>
      <button class="btn" onclick="alternarTodos(false)">➖ Cerrar todo</button>
    </div>
  </div>

  <div id="arbol"></div>
</div>

<script>
// =====================================================
// 1. BASE DE DATOS ULTRA COMPACTA (1 línea por persona)
// =====================================================
const familia = {
  n: "Bisabuelo Fundador", r: "1ª Gen • Patriarca", i: "👑", g: 1, d: { "🎂 Nac": "1920", "📍 Lugar": "Caracas", "💼 Oficio": "Comerciante", "❤️ Pareja": "Bisabuela" }, bio: "Inició el legado familiar. Aquí se muestra toda su biografía, anécdotas e hitos importantes.", h: [
    { n: "Abuelo (Rama A)", r: "2ª Gen", i: "⚡", g: 2, d: { "🎂 Nac": "1948", "📍 Lugar": "Caracas", "💼 Profesión": "Ingeniero" }, bio: "Continuó la tradición familiar y expandió la primera rama.", h: [
      { n: "Padre / Madre", r: "3ª Gen", i: "🌟", g: 3, d: { "🎂 Nac": "1975", "📍 Lugar": "Caracas", "💼 Área": "Operaciones" }, bio: "Líder de la tercera generación con enfoque en organización y gestión.", h: [
        { n: "Hijo / Hija", r: "4ª Gen", i: "🚀", g: 4, d: { "🎂 Nac": "2008", "📍 Lugar": "Caracas", "🎯 Interés": "Arte y Diseño" }, bio: "Nueva generación de la familia.", h: [] }
      ]}
    ]},
    { n: "Tío Abuelo (Rama B)", r: "2ª Gen", i: "🛡️", g: 2, d: { "🎂 Nac": "1952", "📍 Lugar": "Valencia", "💼 Profesión": "Médico" }, bio: "Historia completa y detalles de la segunda rama familiar.", h: [] }
  ]
};

// Colores automáticos según generación
const coloresGen = { 1: "var(--gen1)", 2: "var(--gen2)", 3: "var(--gen3)", 4: "var(--gen4)" };

// =====================================================
// 2. MOTOR DE RENDERIZADO E INTERACTIVIDAD
// =====================================================
const render = (p) => {
  const color = coloresGen[p.g] || "var(--gen2)";
  const totalHijos = p.h ? p.h.length : 0;
  const textoBusqueda = `${p.n} ${p.r} ${p.bio} ${Object.values(p.d||{}).join(' ')}`.toLowerCase();

  return `
  <div class="nodo" data-search="${textoBusqueda}" style="--color-gen: ${color}">
    <div class="barra" onclick="toggleFicha(this)">
      <span class="avatar">${p.i || '👤'}</span>
      <span class="nom">${p.n}</span>
      <span class="badge-rol">${p.r}</span>
      ${totalHijos > 0 ? `<span class="badge-hijos" title="Descendientes directos">🌿 ${totalHijos}</span>` : ''}
      <span class="flecha">▼</span>
    </div>
    <div class="ficha">
      <div class="grid-datos">
        ${Object.entries(p.d||{}).map(([k,v])=>`
          <div class="dato-item">
            <span class="dato-label">${k}</span>
            <span class="dato-valor">${v}</span>
          </div>`).join('')}
      </div>
      <div class="historia">${p.bio || ''}</div>
    </div>
    ${totalHijos > 0 ? `<div class="rama">${p.h.map(render).join('')}</div>` : ''}
  </div>`;
};

function toggleFicha(barra) {
  barra.classList.toggle('activo');
  barra.nextElementSibling.classList.toggle('abierto');
}

function alternarTodos(abrir) {
  document.querySelectorAll('.barra').forEach(b => b.classList.toggle('activo', abrir));
  document.querySelectorAll('.ficha').forEach(f => f.classList.toggle('abierto', abrir));
}

function filtrarArbol(texto) {
  const q = texto.trim().toLowerCase();
  document.querySelectorAll('.nodo').forEach(nodo => {
    if (!q) {
      nodo.classList.remove('oculto-filtro');
      return;
    }
    const coincide = nodo.dataset.search.includes(q) || 
                     Array.from(nodo.querySelectorAll('.nodo')).some(hijo => hijo.dataset.search.includes(q));
    nodo.classList.toggle('oculto-filtro', !coincide);
  });
}

document.getElementById("arbol").innerHTML = render(familia);
</script>
</body>
</html>
