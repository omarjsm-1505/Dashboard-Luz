<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Árbol Genealógico Compacto</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body { background: #0f172a; color: #f8fafc; padding: 12px; font-size: 13px; }
  h3 { color: #fbbf24; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; font-size: 14px; }
  .rama { margin-left: 14px; border-left: 1px dashed #334155; padding-left: 8px; }
  .nodo { margin: 4px 0; }
  .barra { display: inline-flex; align-items: center; gap: 8px; background: #1e293b; border: 1px solid #334155; padding: 4px 10px; border-radius: 6px; cursor: pointer; transition: 0.15s; user-select: none; }
  .barra:hover, .barra.activo { border-color: #fbbf24; background: #0f172a; box-shadow: 0 0 8px rgba(251,191,36,0.25); }
  .rol { color: #38bdf8; font-weight: 700; font-size: 10px; text-transform: uppercase; background: #0f172a; padding: 2px 5px; border-radius: 4px; }
  .nom { font-weight: 600; color: #f8fafc; }
  .info { display: none; background: #0b1120; border-left: 3px solid #fbbf24; margin: 4px 0 6px 8px; padding: 6px 10px; border-radius: 0 6px 6px 0; font-size: 12px; color: #cbd5e1; max-width: 520px; }
  .info.abierto { display: block; animation: fadeIn 0.2s ease; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
  .tag { background: #1e293b; border: 1px solid #334155; padding: 1px 6px; border-radius: 4px; font-size: 11px; color: #94a3b8; }
  .tag b { color: #e2e8f0; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<h3>⚡ Linaje Familiar (Toque un nombre para desglosar)</h3>
<div id="arbol"></div>

<script>
// 1. DATOS EN FORMATO ULTRA COMPACTO (1 línea por persona)
const familia = {
  n: "Bisabuelo Fundador", r: "Gen 1", d: { Nac: "1920", Lugar: "Caracas", Oficio: "Comerciante" }, bio: "Historia y datos principales del fundador.", h: [
    { n: "Abuelo (Rama A)", r: "Gen 2", d: { Nac: "1948", Profesión: "Ingeniero", Hijos: "2" }, bio: "Reseña completa del abuelo.", h: [
      { n: "Padre / Madre", r: "Gen 3", d: { Nac: "1975", Área: "Operaciones" }, bio: "Información detallada al tocar el nombre.", h: [] }
    ]},
    { n: "Tío Abuelo (Rama B)", r: "Gen 2", d: { Nac: "1952", Profesión: "Médico" }, bio: "Reseña completa de la segunda rama.", h: [] }
  ]
};

// 2. MOTOR COMPACTO DE RENDERIZADO
const render = (p) => `
  <div class="nodo">
    <div class="barra" onclick="this.classList.toggle('activo'); this.nextElementSibling.classList.toggle('abierto')">
      <span class="rol">${p.r}</span><span class="nom">${p.n}</span>
    </div>
    <div class="info">
      <div class="tags">${Object.entries(p.d||{}).map(([k,v])=>`<span class="tag"><b>${k}:</b>${v}</span>`).join('')}</div>
      <div>${p.bio||''}</div>
    </div>
    ${p.h && p.h.length ? `<div class="rama">${p.h.map(render).join('')}</div>` : ''}
  </div>`;

document.getElementById("arbol").innerHTML = render(familia);
</script>
</body>
</html>
