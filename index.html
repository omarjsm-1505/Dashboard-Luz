<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luz · Tablero Gerencial (Esquema Consolidado)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F7F9; --surface: #FFFFFF; --border: #E2E8F0;
    --primary: #0F172A; --primary-light: #334155; --accent: #0284C7;
    --text: #1E293B; --text-light: #64748B;
    --up: #16A34A; --up-bg: #DCFCE7; 
    --down: #DC2626; --down-bg: #FEE2E2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  
  .topbar { background: var(--primary); color: #FFF; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; }
  .btn-print { background: var(--accent); color: #FFF; border: none; padding: 6px 14px; font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer; }
  
  .container { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
  
  .header { margin-bottom: 24px; }
  .header h1 { margin: 0 0 4px; font-size: 22px; color: var(--primary); letter-spacing: -0.5px; }
  .header p { margin: 0; font-size: 13px; color: var(--text-light); }
  
  /* PESTAÑAS (TABS) */
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 2px solid var(--border); }
  .tab-btn { background: transparent; border: none; padding: 10px 20px; font-size: 13px; font-weight: 600; color: var(--text-light); cursor: pointer; position: relative; transition: color 0.2s; }
  .tab-btn.active { color: var(--accent); }
  .tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 2px; background: var(--accent); border-radius: 2px 2px 0 0; }
  
  /* TABLA GERENCIAL */
  .table-wrapper { background: var(--surface); border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow-x: auto; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; min-width: 750px; text-align: right; }
  th { background: #F8FAFC; color: var(--text-light); font-size: 11px; text-transform: uppercase; font-weight: 600; padding: 14px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: inherit; z-index: 2; }
  th:first-child { background: #F8FAFC; }
  
  td { padding: 12px; border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--primary-light); }
  tbody tr { background: var(--surface); transition: background 0.15s; }
  tbody tr:hover { background: #F1F5F9; }
  
  .cell-branch { font-family: 'Inter', sans-serif; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 8px; }
  .badge-zone { font-size: 9px; padding: 2px 6px; border-radius: 4px; background: #E2E8F0; color: var(--text-light); text-transform: uppercase; font-family: 'Inter'; }
  
  /* MICRO BARRAS INLINE */
  .pct-cell { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .bar-bg { width: 50px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }
  
  .gap-pos { color: var(--up); background: var(--up-bg); padding: 4px 8px; border-radius: 6px; font-weight: 700; font-size: 12px; display: inline-block; }
  .gap-neg { color: var(--down); background: var(--down-bg); padding: 4px 8px; border-radius: 6px; font-weight: 700; font-size: 12px; display: inline-block; }
  
  tfoot tr { background: var(--primary) !important; color: #FFF; }
  tfoot td { color: #FFF; font-weight: 700; border-bottom: none; }
  tfoot th:first-child { background: var(--primary); }
  
  @media (max-width: 600px) {
    .container { padding: 12px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <span>📊 DASHBOARD LUZ: ESQUEMA CONSOLIDADO</span>
  <button class="btn-print" onclick="window.print()">Exportar PDF</button>
</div>

<div class="container">
  <div class="header">
    <h1>Seguimiento de Presupuesto</h1>
    <p>Corte al: <b>26 de Agosto de 2026</b> | Valla Teórica: <b style="color:var(--accent)">83.87%</b></p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="setMode('valor', this)">💵 VALOR ($)</button>
    <button class="tab-btn" onclick="setMode('unidades', this)">📦 UNIDADES</button>
  </div>

  <div class="table-container">
    <div class="table-wrapper">
      <table id="mainTable">
        <thead>
          <tr>
            <th>Sucursal</th>
            <th>Presupuesto</th>
            <th>Cumplimiento</th>
            <th>% Cump.</th>
            <th>% Part.</th>
            <th>Proyección</th>
            <th>Brecha (Ppto)</th>
          </tr>
        </thead>
        <tbody id="tBody"></tbody>
        <tfoot id="tFoot"></tfoot>
      </table>
    </div>
  </div>
</div>
<script>
// Base de datos matriz PDF (Corte 26/08)
const db = [
  { n: 'Carlota', zone: 'ESTE', vp: 1131254, vc: 897150, vpct: 79.31, vpart: 22.39, vproy: 1069679, vgap: -61575, up: 505599, uc: 398746, upct: 78.87, upart: 20.35, uproy: 475428, ugap: -30171 },
  { n: 'Chacao', zone: 'OESTE', vp: 524853, vc: 456267, vpct: 86.93, vpart: 11.39, vproy: 544011, vgap: 19158, up: 278248, uc: 242872, upct: 87.29, upart: 12.39, uproy: 289578, ugap: 11330 },
  { n: 'Dos Caminos', zone: 'OESTE', vp: 297284, vc: 244361, vpct: 82.20, vpart: 6.10, vproy: 291354, vgap: -5930, up: 157062, uc: 127902, upct: 81.43, upart: 6.53, uproy: 152499, ugap: -4563 },
  { n: 'Florida', zone: 'OESTE', vp: 702396, vc: 591553, vpct: 84.22, vpart: 14.76, vproy: 705313, vgap: 2917, up: 342792, uc: 284193, upct: 82.91, upart: 14.50, uproy: 338846, ugap: -3946 },
  { n: 'Luz Quick Rest', zone: 'OESTE', vp: 169594, vc: 145685, vpct: 85.90, vpart: 3.64, vproy: 173701, vgap: 4107, up: 90081, uc: 75170, upct: 83.45, upart: 3.84, uproy: 89626, ugap: -455 },
  { n: 'Llanito', zone: 'ESTE', vp: 461358, vc: 379242, vpct: 82.20, vpart: 9.47, vproy: 452173, vgap: -9185, up: 230778, uc: 189895, upct: 82.28, upart: 9.69, uproy: 226413, ugap: -4365 },
  { n: 'Marques', zone: 'ESTE', vp: 150397, vc: 119022, vpct: 79.14, vpart: 2.97, vproy: 141911, vgap: -8486, up: 79860, uc: 63124, upct: 79.04, upart: 3.22, uproy: 75263, ugap: -4597 },
  { n: 'Pedregal', zone: 'OESTE', vp: 326410, vc: 267351, vpct: 81.91, vpart: 6.67, vproy: 318765, vgap: -7645, up: 173384, uc: 140260, upct: 80.90, upart: 7.16, uproy: 167233, ugap: -6151 },
  { n: 'San Antonio', zone: 'ESTE', vp: 493102, vc: 419943, vpct: 85.16, vpart: 10.48, vproy: 500701, vgap: 7599, up: 240570, uc: 202949, upct: 84.36, upart: 10.36, uproy: 241978, ugap: 1408 },
  { n: 'Urbina', zone: 'ESTE', vp: 623353, vc: 485989, vpct: 77.96, vpart: 12.13, vproy: 579448, vgap: -43905, up: 301625, uc: 234635, upct: 77.79, upart: 11.97, uproy: 279757, ugap: -21868 }
];

let mode = 'valor'; // valor o unidades

function fmt(n) { return n.toLocaleString('es-VE'); }
function fmtS(n) { return (n > 0 ? '+' : '') + n.toLocaleString('es-VE'); }

function renderTable() {
  const tBody = document.getElementById('tBody');
  const tFoot = document.getElementById('tFoot');
  
  let html = '';
  let totP = 0, totC = 0, totProy = 0, totGap = 0;

  // Ordenar de mayor a menor cumplimiento para mantener jerarquía
  const sortedDb = [...db].sort((a,b) => (mode === 'valor' ? b.vpct - a.vpct : b.upct - a.upct));

  sortedDb.forEach(r => {
    let p, c, pct, part, proy, gap, prefix;
    if(mode === 'valor') {
      p = r.vp; c = r.vc; pct = r.vpct; part = r.vpart; proy = r.vproy; gap = r.vgap; prefix = '$';
    } else {
      p = r.up; c = r.uc; pct = r.upct; part = r.upart; proy = r.uproy; gap = r.ugap; prefix = '';
    }
    
    totP += p; totC += c; totProy += proy; totGap += gap;
    
    const gapClass = gap > 0 ? 'gap-pos' : 'gap-neg';
    const barColor = pct >= 83.87 ? 'var(--up)' : 'var(--accent)';

    html += `
      <tr>
        <td>
          <div class="cell-branch">
            ${r.n} <span class="badge-zone">${r.zone}</span>
          </div>
        </td>
        <td>${prefix}${fmt(p)}</td>
        <td style="color:var(--text); font-weight:700;">${prefix}${fmt(c)}</td>
        <td>
          <div class="pct-cell">
            <span>${pct.toFixed(2).replace('.',',')}%</span>
            <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(pct, 100)}%; background:${barColor};"></div></div>
          </div>
        </td>
        <td style="color:var(--text-light);">${part.toFixed(2).replace('.',',')}%</td>
        <td>${prefix}${fmt(proy)}</td>
        <td><span class="${gapClass}">${prefix}${fmtS(gap)}</span></td>
      </tr>
    `;
  });

  tBody.innerHTML = html;

  // Totales
  const totPct = (totC / totP) * 100;
  const totGapClass = totGap > 0 ? 'gap-pos' : 'gap-neg';
  const tPrefix = mode === 'valor' ? '$' : '';

  tFoot.innerHTML = `
    <tr>
      <td>TOTAL GENERAL</td>
      <td>${tPrefix}${fmt(totP)}</td>
      <td>${tPrefix}${fmt(totC)}</td>
      <td>${totPct.toFixed(2).replace('.',',')}%</td>
      <td>100,00%</td>
      <td>${tPrefix}${fmt(totProy)}</td>
      <td><span class="${totGapClass}" style="background:transparent; color:#FFF; border:1px solid rgba(255,255,255,0.4);">${tPrefix}${fmtS(totGap)}</span></td>
    </tr>
  `;
}

function setMode(newMode, btn) {
  mode = newMode;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

renderTable();
</script>
</body>
</html>
